name: Transfer storyboard frames
on:
  push:
    paths:
      - .github/workflows/transfer-storyboard.yml
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: na-avenida-storyboard
          path: assets/cena-*.png
          compression-level: 0
