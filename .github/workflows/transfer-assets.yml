name: Transfer exact visual assets
on:
  push:
    paths:
      - .github/workflows/transfer-assets.yml
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: na-avenida-exact-assets
          path: |
            assets/fachada-final.png
            assets/entrada-final.png
          compression-level: 0
